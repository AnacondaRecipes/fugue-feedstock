{% set name = "fugue" %}
{% set version = "0.9.9" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  # upstream tags are "v"-prefixed as of 0.9.7
  url: https://github.com/fugue-project/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 97daef2bd0ae0610d60a9824e64000820020a93d591dea13914daf2d69a78c0b

build:
  number: 0
  skip: true  # [py<311]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed -vvv

requirements:
  host:
    - pip
    - python
    - setuptools >=61.0
    - wheel
  run:
    - python
    - triad >=1.0.4
    - adagio >=0.2.6
    - packaging
    - pandas  # [py<315]
    - pandas >=3  # [py>=315]
  run_constrained:
    # bounded deps from upstream extras; unversioned extra deps are no-ops here
    # sql / duckdb / ibis extras
    - fugue-sql-antlr >=0.2.4
    - sqlglot <28
    - python-duckdb >=0.5.0
    # spark extra
    - pyspark >=3.5  # [py<312]
    - pyspark >=4.0  # [py>=312]
    - zstandard >=0.25.0
    # dask extra (pandas >=2.0.2 is feature-only; core allows unversioned pandas)
    - dask-core >=2025.12.0
    - pyarrow >=7.0.0
    # ray extra (upstream declares no ray extra for python 3.14+)
    - ray >=2.30.0  # [py<314]
    # notebook extra
    - ipython >=7.10.0

{% set sql_deselected_tests = " --deselect=tests/fugue/sql/test_workflow.py::test_fsql" %}
{% set sql_deselected_tests = sql_deselected_tests + " --deselect=tests/fugue/sql/test_workflow.py::test_conf_override" %}
{% set sql_deselected_tests = sql_deselected_tests + " --deselect=tests/fugue/sql/test_workflow.py::test_jinja_keyword_in_sql" %}
{% set sql_deselected_tests = sql_deselected_tests + " --deselect=tests/fugue/sql/test_workflow.py::test_use_soecial_df" %}
{% set timing_deselected_tests = " --deselect=tests/fugue/workflow/test_workflow_parallel.py::test_parallel" %}

test:
  source_files:
    - tests
    - pyproject.toml
  imports:
    - fugue
    - fugue._utils
    - fugue.api
    - fugue.bag
    - fugue.collections
    - fugue.column
    - fugue.constants
    - fugue.dataframe
    - fugue.dataset
    - fugue.dev
    - fugue.exceptions
    - fugue.execution
    - fugue.extensions
    - fugue.plugins
    - fugue.registry
    - fugue.rpc
    - fugue.sql
    - fugue.workflow
  requires:
    - pip
    - pytest
    - pytest-cov
    - fugue-sql-antlr >=0.2.4
    - python-duckdb >=0.5.0
    - sqlglot <28  # [py<315 and not (win and arm64)]
    - s3fs
    - matplotlib-base
    - cloudpickle
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    # sqlglot <28 does not exist on pkgs/main for win-arm64 or py3.15; test_parallel's timing assertion is flaky on osx CI
    - pytest -vv tests/fugue  # [py<315 and not (win and arm64) and not osx]
    - pytest -vv tests/fugue{{ sql_deselected_tests }}  # [(py>=315 or (win and arm64)) and not osx]
    - pytest -vv tests/fugue{{ timing_deselected_tests }}  # [osx and py<315]
    - pytest -vv tests/fugue{{ timing_deselected_tests }}{{ sql_deselected_tests }}  # [osx and (py>=315 or (win and arm64))]

about:
  home: https://github.com/fugue-project/fugue
  summary: An abstraction layer for distributed computation
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  description: |
    Fugue is a unified interface for distributed computing that lets
    users execute Python, pandas, and SQL code on Spark and Dask
    without rewrites. It is meant for data scientists/analysts who want
    to focus on defining logic rather than worrying about execution. It
    is also suitable for SQL users wanting to use SQL to define
    end-to-end workflows in pandas, Spark, and Dask. Data scientists
    using pandas wanting to take advantage of Spark or Dask with
    minimal effort, as well as big data practitioners finding testing
    code to be costly and slow would also find Fugue useful.
  doc_url: https://fugue-tutorials.readthedocs.io
  dev_url: https://github.com/fugue-project/fugue

extra:
  recipe-maintainers:
    - kvnkho
    - goodwanghan
    - charlesbluca
    - thewchan
